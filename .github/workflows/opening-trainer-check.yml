name: "Opening trainer: check lines"

on:
  push:
    paths: ["opening-trainer/**"]
  pull_request:
    paths: ["opening-trainer/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node opening-trainer/tools/validate.js
